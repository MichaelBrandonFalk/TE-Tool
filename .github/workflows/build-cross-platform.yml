name: Build Windows and Linux Mint packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "11.11"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      PORTABLE_GIT_URL: https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/PortableGit-2.56.0.2-64-bit.7z.exe
      PORTABLE_GIT_SHA256: 075e158ef8e1f0ab80b347e245405d3eca735c2dc88fd8e032e137d0ca61f61b
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-15-13-03/ffmpeg-n8.1.3-18-g46d899d7a0-win64-lgpl-shared-8.1.zip
      FFMPEG_SHA256: 4acd82323c2cad9c7ffea5b8e335ebcda39beae83a3138d729545e5a7666a3fd
      EXIFTOOL_URL: https://sourceforge.net/projects/exiftool/files/exiftool-13.59_64.zip/download
      EXIFTOOL_SHA256: 44b512b25af500724ba579d0a53c8fc5851628b692dd5e5d94ae4a15c2cba9ec
      JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-windows-amd64.exe
      JQ_SHA256: 23cb60a1354eed6bcc8d9b9735e8c7b388cd1fdcb75726b93bc299ef22dd9334

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7" "pillow>=10,<13"
          choco install innosetup --yes --no-progress

      - name: Download verified runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item "$env:RUNNER_TEMP\te-deps" -ItemType Directory -Force | Out-Null

          function Get-VerifiedFile([string]$Url, [string]$Output, [string]$ExpectedHash) {
            curl.exe --fail --location --silent --show-error $Url --output $Output
            $actual = (Get-FileHash $Output -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $ExpectedHash.ToLowerInvariant()) {
              throw "Checksum mismatch for $Output. Expected $ExpectedHash, got $actual."
            }
          }

          $gitArchive = "$env:RUNNER_TEMP\te-deps\PortableGit.exe"
          $ffmpegArchive = "$env:RUNNER_TEMP\te-deps\ffmpeg.zip"
          $exiftoolArchive = "$env:RUNNER_TEMP\te-deps\exiftool.zip"
          $jqExe = "$env:RUNNER_TEMP\te-deps\jq.exe"

          Get-VerifiedFile $env:PORTABLE_GIT_URL $gitArchive $env:PORTABLE_GIT_SHA256
          Get-VerifiedFile $env:FFMPEG_URL $ffmpegArchive $env:FFMPEG_SHA256
          Get-VerifiedFile $env:EXIFTOOL_URL $exiftoolArchive $env:EXIFTOOL_SHA256
          Get-VerifiedFile $env:JQ_URL $jqExe $env:JQ_SHA256

          $gitRoot = "$env:RUNNER_TEMP\te-deps\PortableGit"
          $ffmpegRoot = "$env:RUNNER_TEMP\te-deps\ffmpeg"
          $exiftoolRoot = "$env:RUNNER_TEMP\te-deps\exiftool"
          New-Item $gitRoot -ItemType Directory -Force | Out-Null
          & $gitArchive -y "-o$gitRoot" | Out-Null
          Expand-Archive $ffmpegArchive $ffmpegRoot -Force
          Expand-Archive $exiftoolArchive $exiftoolRoot -Force

          "PORTABLE_GIT_ROOT=$gitRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FFMPEG_ROOT=$ffmpegRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "EXIFTOOL_ROOT=$exiftoolRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JQ_EXE=$jqExe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and validate Windows package
        shell: pwsh
        run: .\packaging\build_windows.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: te-tool-windows-${{ inputs.version }}
          path: dist/TE-Tool-Version-${{ inputs.version }}-Windows-x64-Setup.exe
          if-no-files-found: error
          compression-level: 0

  linux-mint:
    name: Linux Mint amd64
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 python3-tk ffmpeg jq libimage-exiftool-perl

      - name: Run source checks
        run: |
          python3 -m py_compile cross_platform/te_tool_app.py Resources/Cussbuster2000.py
          bash -n Resources/script Resources/metadata_helpers.sh packaging/build_linux_mint_deb.sh
          tests/test_metadata_helpers.sh

      - name: Build Linux Mint package
        run: |
          chmod +x packaging/build_linux_mint_deb.sh
          VERSION="$VERSION" packaging/build_linux_mint_deb.sh
          dpkg-deb --info "dist/TE-Tool-Version-$VERSION-Linux-Mint-amd64.deb"
          dpkg-deb --contents "dist/TE-Tool-Version-$VERSION-Linux-Mint-amd64.deb"

      - name: Install and validate Linux Mint package
        run: |
          sudo apt-get install --yes "./dist/TE-Tool-Version-$VERSION-Linux-Mint-amd64.deb"
          te-tool --self-test
          fixture_dir="$(mktemp -d)"
          ffmpeg -v error -f lavfi -i color=size=1920x1080:rate=24000/1001:color=black \
            -t 0.25 -c:v libx264 -metadata:s:v:0 language=eng "$fixture_dir/phase1.mov"
          TE_LOG_DIR="$fixture_dir/logs" TE_TMP_DIR="$fixture_dir/tmp" \
            te-tool --headless --phase1-only "$fixture_dir/phase1.mov" | tee "$fixture_dir/output.txt"
          grep -F "VIDEO LANGUAGE TAGS:" "$fixture_dir/output.txt"
          grep -F "AUDIO CODEC:" "$fixture_dir/output.txt"
          grep -F "Total TE processing time:" "$fixture_dir/output.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: te-tool-linux-mint-${{ inputs.version }}
          path: dist/TE-Tool-Version-${{ inputs.version }}-Linux-Mint-amd64.deb
          if-no-files-found: error
          compression-level: 0
